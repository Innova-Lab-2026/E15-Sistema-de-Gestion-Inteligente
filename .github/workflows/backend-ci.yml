name: backend-ci

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: tecba
          POSTGRES_PASSWORD: tecba
          POSTGRES_DB: tecba
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tecba -d tecba"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Recreated by tests/conftest.py on every run.
      TEST_DATABASE_URL: postgresql+asyncpg://tecba:tecba@localhost:5432/tecba_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t tecba-api:ci .
