services:
  db:
    image: postgis/postgis:16-3.4
    container_name: tecba-db
    environment:
      POSTGRES_USER: tecba
      POSTGRES_PASSWORD: tecba
      POSTGRES_DB: tecba
    ports:
      - "5432:5432"
    volumes:
      - tecba_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tecba -d tecba"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: tecba-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://tecba:tecba@db:5432/tecba
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - full

volumes:
  tecba_pgdata:
